<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guestbook - modios.online</title>
  <style>
    /* Global Styles matching modios.online retro theme */
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
      background-color: #f0f0f0;
      color: #111;
      margin: 20px;
      padding: 0;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 4px;
    }

    p.subtitle {
      margin-top: 0;
      margin-bottom: 15px;
      color: #333;
    }

    hr.divider {
      border: none;
      border-top: 1px dashed #666;
      margin-bottom: 20px;
    }

    /* Content Cards */
    .card {
      background-color: #ffffff;
      border: 1px solid #ccc;
      padding: 15px 20px;
      margin-bottom: 20px;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.05);
    }

    .card h2 {
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 12px;
      color: #0055a5;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Form Controls */
    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
      font-size: 14px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #888;
      background-color: #fafafa;
      font-family: inherit;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      height: 90px;
    }

    /* Button Styling */
    .btn {
      background-color: #e1e1e1;
      border: 1px solid #777;
      padding: 6px 14px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 1px 1px 0px #fff inset;
    }

    .btn:hover {
      background-color: #d0d0d0;
    }

    .btn:active {
      background-color: #bbb;
    }
