<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instant Messaging App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col justify-center items-center">

    <!-- Login Screen -->
    <div id="login-screen" class="p-8 bg-gray-800 rounded-xl shadow-2xl text-center max-w-md w-full border border-gray-700">
        <h1 class="text-2xl font-bold mb-2">Welcome to Chat</h1>
        <p class="text-gray-400 text-sm mb-6">Choose an option to start messaging instantly.</p>
        
        <!-- Fake Google Login Button (Zero MFA / Zero Setup) -->
        <button onclick="mockGoogleLogin()" class="w-full flex items-center justify-center gap-3 bg-white text-gray-700 font-semibold py-3 px-4 rounded-lg hover:bg-gray-100 transition shadow-md mb-4">
            <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.2v3.15C3.15 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.2C.43 8.15 0 9.89 0 12s.43 3.85 1.2 5.4l4.07-3.16z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.68 1.2 6.6l4.07 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
            Sign in with Google
        </button>
    </div>

    <!-- Chat Screen (Hidden initially) -->
    <div id="chat-screen" class="hidden text-center p-8 bg-gray-800 rounded-xl shadow-2xl max-w-md w-full border border-gray-700">
        <h1 class="text-3xl font-bold mb-2">Hello, <span id="user-name"></span>!</h1>
        <p class="text-gray-400 text-sm mb-6" id="user-email"></p>
        <div class="bg-gray-900 p-4 rounded-lg h-40 mb-4 flex items-center justify-center text-gray-500 border border-gray-800">
            [Chat interface active & ready]
        </div>
        <button onclick="logout()" class="bg-red-500/10 text-red-400 border border-red-500/20 px-4 py-2 rounded-lg hover:bg-red-500 hover:text-white transition w-full">Sign Out</button>
    </div>

    <script>
        function mockGoogleLogin() {
            // Instantly simulates a successful Google Sign-in profile response without network calls or MFA
            const mockUser = {
                name: "Alex Johnson",
                email: "alex.johnson@gmail.com"
            };

            localStorage.setItem('chat_user', JSON.stringify(mockUser));
            loadChat(mockUser);
        }

        function loadChat(user) {
            document.getElementById('user-name').textContent = user.name;
            document.getElementById('user-email').textContent = user.email;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
        }

        function logout() {
            localStorage.removeItem('chat_user');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('chat-screen').classList.add('hidden');
        }

        // Check if already logged in on page load
        window.onload = () => {
            const savedUser = localStorage.getItem('chat_user');
            if (savedUser) {
                loadChat(JSON.parse(savedUser));
            }
        };
    </script>
</body>
</html>
