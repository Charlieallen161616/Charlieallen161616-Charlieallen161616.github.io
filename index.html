<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Direct Google Login Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col justify-center items-center">

    <!-- Login Screen -->
    <div id="login-screen" class="p-8 bg-gray-800 rounded-xl shadow-2xl text-center max-w-md w-full">
        <h1 class="text-2xl font-bold mb-6">Sign In with Google</h1>
        <p class="text-gray-400 text-sm mb-6">Click below to log in using your Google account instantly.</p>
        
        <!-- Google One Tap / Sign-in Button Container -->
        <div id="g_id_onload"
             data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_select="false"
             data-use_fedcm_for_prompt="true">
        </div>
        <div class="g_id_signin"
             data-type="standard"
             data-shape="rectangular"
             data-theme="outline"
             data-text="sign_in_with"
             data-size="large"
             data-logo_alignment="left">
        </div>
    </div>

    <!-- Chat Screen (Hidden until logged in) -->
    <div id="chat-screen" class="hidden text-center p-8 bg-gray-800 rounded-xl shadow-2xl max-w-md w-full">
        <h1 class="text-3xl font-bold mb-2">Welcome, <span id="user-name"></span>!</h1>
        <p class="text-gray-400 mb-6" id="user-email"></p>
        <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 w-full">Sign Out</button>
    </div>

    <script>
        // Decodes the JWT token returned by Google
        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('0' + c.slice(-2));
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // Triggered automatically when Google sign-in succeeds
        function handleCredentialResponse(response) {
            const responsePayload = parseJwt(response.credential);
            
            console.log("User ID: " + responsePayload.sub);
            console.log("Name: " + responsePayload.name);
            console.log("Email: " + responsePayload.email);

            // Update UI to show chat screen
            document.getElementById('user-name').textContent = responsePayload.name;
            document.getElementById('user-email').textContent = responsePayload.email;
            
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
        }

        function logout() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('chat-screen').classList.add('hidden');
            // Optional: reset google prompt if needed
            google.accounts.id.disableAutoSelect();
        }
    </script>
</body>
</html>
