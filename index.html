<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusChat - Real-Time Messaging</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 antialiased selection:bg-brand-500 selection:text-white">

    <div id="app" class="h-full flex flex-col overflow-hidden">
        
        <!-- Auth View -->
        <div id="auth-view" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
            <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 transform transition-all">
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-brand-600 text-white text-2xl font-bold mb-4 shadow-lg shadow-brand-500/30">
                        <i class="fa-solid fa-comments"></i>
                    </div>
                    <h1 class="text-2xl font-bold tracking-tight text-white">Welcome to NexusChat</h1>
                    <p class="text-sm text-slate-400 mt-1">Connect in real-time across tabs & devices</p>
                </div>

                <!-- Custom Alert Banner -->
                <div id="auth-alert" class="hidden mb-4 p-3 rounded-lg text-sm bg-rose-500/10 border border-rose-500/20 text-rose-400 flex items-center gap-2">
                    <i class="fa-solid fa-circle-exclamation flex-shrink-0"></i>
                    <span id="auth-alert-msg">Error message goes here</span>
                </div>

                <!-- Google Sign In Button -->
                <button type="button" onclick="loginWithGoogle()" class="w-full mb-4 py-3 px-4 bg-white hover:bg-slate-100 text-slate-900 font-semibold rounded-xl shadow transition duration-200 flex items-center justify-center gap-3">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.19v3.15C3.17 21.36 7.23 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.5-.38-2.24s.13-1.52.38-2.24V6.61H1.19C.43 8.14 0 9.88 0 12s.43 3.86 1.19 5.39l4.08-3.15z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.64 1.19 6.61l4.08 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
                    </svg>
                    Continue with Google
                </button>

                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-slate-800"></div>
                    <span class="flex-shrink mx-4 text-xs text-slate-500 uppercase tracking-widest">or email</span>
                    <div class="flex-grow border-t border-slate-800"></div>
                </div>

                <form id="auth-form" class="space-y-4 mt-2" onsubmit="handleEmailAuthSubmit(event)">
                    <div id="name-field-container" class="hidden">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Display Name</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500"><i class="fa-solid fa-user"></i></span>
                            <input type="text" id="display-name" placeholder="John Doe" class="w-full bg-slate-800/50 border border-slate-700/80 rounded-xl px-4 py-3 pl-10 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Email Address</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" id="auth-email" required placeholder="name@example.com" class="w-full bg-slate-800/50 border border-slate-700/80 rounded-xl px-4 py-3 pl-10 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="auth-password" required placeholder="••••••••" class="w-full bg-slate-800/50 border border-slate-700/80 rounded-xl px-4 py-3 pl-10 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition">
                        </div>
                    </div>

                    <button type="submit" id="auth-submit-btn" class="w-full mt-2 py-3 px-4 bg-brand-600 hover:bg-brand-500 text-white font-medium rounded-xl shadow-lg shadow-brand-600/20 transition duration-200">
                        Sign In
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <button type="button" onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-xs text-brand-400 hover:text-brand-300 font-medium transition">
                        Don't have an account? <span class="underline">Sign up</span>
                    </button>
                </div>
                
                <div class="mt-4 pt-4 border-t border-slate-800/80 text-center">
                    <button type="button" onclick="loginAsGuest()" class="text-xs text-slate-400 hover:text-slate-200 transition">
                        Or continue anonymously as <span id="guest-name-preview" class="underline">Guest</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="main-app" class="hidden h-full flex flex-row relative overflow-hidden">
            
            <!-- Mobile Sidebar Backdrop -->
            <div id="sidebar-backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-30 md:hidden hidden transition-opacity"></div>

            <!-- Sidebar Navigation -->
            <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-80 bg-slate-950 border-r border-slate-800 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out">
                <!-- User Profile Header -->
                <div class="p-4 border-b border-slate-800/80 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="relative">
                            <div id="user-avatar" class="w-10 h-10 rounded-full bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center font-bold text-white shadow-inner">
                                U
                            </div>
                            <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-950 rounded-full"></span>
                        </div>
                        <div class="overflow-hidden">
                            <h3 id="current-user-name" class="font-semibold text-sm truncate text-white">Loading...</h3>
                            <p class="text-xs text-emerald-400 flex items-center gap-1 font-medium">Online</p>
                        </div>
                    </div>
                    <button onclick="logout()" title="Sign Out" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-slate-900 rounded-lg transition">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    </button>
                </div>

                <!-- Rooms & Direct Messages Navigation -->
                <div class="flex-1 overflow-y-auto p-4 space-y-6">
                    <!-- Rooms Section -->
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Chat Rooms</span>
                            <button onclick="openCreateRoomModal()" title="Create Room" class="text-xs text-brand-400 hover:text-brand-300 p-1"><i class="fa-solid fa-plus"></i></button>
                        </div>
                        <div id="rooms-list" class="space-y-1">
                            <!-- Populated via JS -->
                        </div>
                    </div>

                    <!-- Direct Messages Section -->
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Active Peers</span>
                            <span class="text-xs text-slate-500" id="online-count">0 online</span>
                        </div>
                        <div id="users-list" class="space-y-1">
                            <!-- Populated via JS -->
                        </div>
                    </div>
                </div>

                <!-- App Footer info -->
                <div class="p-3 border-t border-slate-800/80 text-center text-xs text-slate-500">
                    NexusChat Live Engine • Multi-tab Ready
                </div>
            </aside>

            <!-- Main Chat Panel -->
            <main class="flex-1 flex flex-col h-full bg-slate-900 overflow-hidden relative">
                <!-- Chat Header -->
                <header class="h-16 px-4 bg-slate-900/90 backdrop-blur border-b border-slate-800 flex items-center justify-between z-10">
                    <div class="flex items-center gap-3">
                        <button onclick="toggleSidebar()" class="md:hidden p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800">
                            <i class="fa-solid fa-bars text-lg"></i>
                        </button>
                        <div class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-brand-400 font-bold" id="active-chat-icon">
                            <i class="fa-solid fa-hashtag"></i>
                        </div>
                        <div>
                            <h2 id="active-chat-title" class="font-bold text-white text-base">General Chat</h2>
                            <p id="active-chat-subtitle" class="text-xs text-slate-400">Public community discussion</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="clearChatHistory()" title="Clear local messages" class="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition">
                            <i class="fa-solid fa-rotate-right"></i>
                        </button>
                    </div>
                </header>

                <!-- Messages Feed -->
                <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 flex flex-col">
                    <!-- Populated via JS -->
                </div>

                <!-- Message Input Footer -->
                <footer class="p-4 bg-slate-900 border-t border-slate-800">
                    <form id="message-form" onsubmit="handleSendMessage(event)" class="flex items-end gap-2 relative">
                        <!-- Emoji Picker Popover -->
                        <div id="emoji-picker" class="hidden absolute bottom-16 left-0 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl p-3 grid grid-cols-6 gap-2 z-20 w-64">
                            <!-- Emojis injected via JS -->
                        </div>

                        <div class="flex items-center gap-1 pb-2">
                            <button type="button" onclick="toggleEmojiPicker()" title="Insert Emoji" class="p-2.5 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition">
                                <i class="fa-regular fa-face-smile text-lg"></i>
                            </button>
                            <button type="button" onclick="triggerMediaUpload()" title="Attach File" class="p-2.5 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition">
                                <i class="fa-solid fa-paperclip text-lg"></i>
                            </button>
                            <input type="file" id="media-input" class="hidden" onchange="handleMediaSelect(event)">
                        </div>

                        <div class="flex-1 bg-slate-800/60 border border-slate-700/80 rounded-2xl focus-within:border-brand-500 focus-within:ring-1 focus-within:ring-brand-500 transition flex items-center px-4 py-2">
                            <textarea id="message-input" rows="1" placeholder="Type your message..." onkeydown="handleKeyDown(event)" class="w-full bg-transparent text-white placeholder-slate-500 focus:outline-none resize-none max-h-32 text-sm py-1"></textarea>
                        </div>

                        <button type="submit" id="send-btn" class="p-3 bg-brand-600 hover:bg-brand-500 text-white rounded-2xl shadow-lg shadow-brand-600/20 transition flex items-center justify-center mb-0.5">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </form>
                </footer>
            </main>
        </div>

        <!-- Custom Notification Toast -->
        <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none bg-slate-800 border border-slate-700 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3">
            <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toast-msg" class="text-sm font-medium">Notification message</span>
        </div>

    </div>

    <script>
        // Multi-tab real-time sync engine utilizing BroadcastChannel & localStorage
        const channelName = 'nexus_chat_sync_channel_v2';
        const broadcastChannel = new BroadcastChannel(channelName);

        // Application State
        window.appState = {
            currentUser: null,
            isSignUp: false,
            activeChatId: 'general',
            activeChatType: 'room', // 'room' or 'dm'
            activeChatName: 'General Chat',
            rooms: [
                { id: 'general', name: 'General Chat', desc: 'Public community discussion', icon: 'fa-hashtag' },
                { id: 'tech', name: 'Tech & Code', desc: 'Development and tech talk', icon: 'fa-code' },
                { id: 'random', name: 'Random Lounge', desc: 'Chill and casual chat', icon: 'fa-mug-hot' }
            ],
            users: []
        };

        const randomGuestNum = Math.floor(1000 + Math.random() * 9000);
        document.getElementById('guest-name-preview').textContent = `Guest_${randomGuestNum}`;

        // Initialize App on load
        window.onload = () => {
            populateEmojis();
            checkExistingSession();
            setupBroadcastListener();
            startHeartbeat();
        };

        // Broadcast Channel Listener for Cross-Tab Sync
        function setupBroadcastListener() {
            broadcastChannel.onmessage = (event) => {
                const { type, payload } = event.data;
                if (type === 'NEW_MESSAGE') {
                    if (payload.chatId === window.appState.activeChatId) {
                        appendMessageToDOM(payload.message);
                    }
                } else if (type === 'PRESENCE_UPDATE' || type === 'ROOM_CREATED') {
                    refreshUsersAndRooms();
                }
            };

            window.addEventListener('storage', (e) => {
                if (e.key && e.key.includes('nexus_chat')) {
                    refreshUsersAndRooms();
                }
            });
        }

        // Session Management
        function checkExistingSession() {
            const savedUser = localStorage.getItem('nexus_chat_current_user');
            if (savedUser) {
                try {
                    window.appState.currentUser = JSON.parse(savedUser);
                    enterMainApp();
                } catch (e) {
                    console.error("Session parse error", e);
                }
            }
        }

        function enterMainApp() {
            const user = window.appState.currentUser;
            updateUserProfileUI(user);
            registerPresence(user);
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            initChatListeners();
        }

        // Google Sign-In Simulation
        window.loginWithGoogle = function() {
            const googleNames = ["Alex Morgan", "Jordan Taylor", "Sam Rivera", "Casey Chen", "Morgan Smith"];
            const randomName = googleNames[Math.floor(Math.random() * googleNames.length)];
            const emailSlug = randomName.toLowerCase().replace(/\s+/g, '');
            
            const user = {
                uid: 'google_' + Math.random().toString(36.substring(2, 9)),
                displayName: randomName,
                email: emailSlug + '@gmail.com',
                avatarBg: 'from-amber-500 to-rose-500'
            };

            window.appState.currentUser = user;
            localStorage.setItem('nexus_chat_current_user', JSON.stringify(user));
            enterMainApp();
            showToast(`Signed in as ${randomName} via Google`);
        };

        // Email / Password Auth
        window.toggleAuthMode = function() {
            window.appState.isSignUp = !window.appState.isSignUp;
            const isUp = window.appState.isSignUp;
            document.getElementById('name-field-container').classList.toggle('hidden', !isUp);
            document.getElementById('auth-submit-btn').textContent = isUp ? 'Create Account' : 'Sign In';
            document.getElementById('auth-toggle-btn').innerHTML = isUp 
                ? 'Already have an account? <span class="underline">Sign in</span>' 
                : "Don't have an account? <span class=\"underline\">Sign up</span>";
        };

        window.handleEmailAuthSubmit = function(event) {
            event.preventDefault();
            const email = document.getElementById('auth-email').value.trim();
            const nameInput = document.getElementById('display-name').value.trim();
            const defaultName = email.split('@')[0];
            const displayName = window.appState.isSignUp ? (nameInput || defaultName) : (localStorage.getItem('nexus_name_' + email) || defaultName);

            const user = {
                uid: 'email_' + btoa(email).replace(/=/g, ''),
                displayName: displayName,
                email: email
            };

            if (window.appState.isSignUp) {
                localStorage.setItem('nexus_name_' + email, displayName);
            }

            window.appState.currentUser = user;
            localStorage.setItem('nexus_chat_current_user', JSON.stringify(user));
            enterMainApp();
            showToast(window.appState.isSignUp ? 'Account created successfully!' : 'Signed in successfully!');
        };

        // Guest Mode
        window.loginAsGuest = function() {
            const guestName = `Guest_${randomGuestNum}`;
            const user = {
                uid: 'guest_' + Math.random().toString(36).substring(2, 9),
                displayName: guestName,
                email: guestName.toLowerCase() + '@guest.nexus'
            };

            window.appState.currentUser = user;
            localStorage.setItem('nexus_chat_current_user', JSON.stringify(user));
            enterMainApp();
            showToast(`Logged in as ${guestName}`);
        };

        window.logout = function() {
            localStorage.removeItem('nexus_chat_current_user');
            window.appState.currentUser = null;
            document.getElementById('auth-view').classList.remove('hidden');
            document.getElementById('main-app').classList.add('hidden');
            showToast('Signed out successfully');
        };

        // User Presence & Active Users
        function registerPresence(user) {
            const key = 'nexus_presence_' + user.uid;
            const userData = { ...user, lastSeen: Date.now() };
            localStorage.setItem(key, JSON.stringify(userData));
            broadcastChannel.postMessage({ type: 'PRESENCE_UPDATE' });
        }

        function startHeartbeat() {
            setInterval(() => {
                if (window.appState.currentUser) {
                    registerPresence(window.appState.currentUser);
                    refreshUsersAndRooms();
                }
            }, 5000);
        }

        function refreshUsersAndRooms() {
            const usersMap = [];
            const now = Date.now();
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('nexus_presence_')) {
                    try {
                        const data = JSON.parse(localStorage.getItem(key));
                        // Active within last 20 seconds
                        if (data && (now - data.lastSeen < 20000)) {
                            if (data.uid !== window.appState.currentUser?.uid) {
                                usersMap.push(data);
                            }
                        }
                    } catch (e) {}
                }
            }
            window.appState.users = usersMap;
            document.getElementById('online-count').textContent = `${usersMap.length + 1} online`;
            renderUsersList();

            // Load custom rooms
            const customRooms = JSON.parse(localStorage.getItem('nexus_custom_rooms') || '[]');
            // Merge unique
            customRooms.forEach(cr => {
                if (!window.appState.rooms.some(r => r.id === cr.id)) {
                    window.appState.rooms.push(cr);
                }
            });
            renderRoomsList();
        }

        function updateUserProfileUI(user) {
            const name = user.displayName || 'Nexus User';
            document.getElementById('current-user-name').textContent = name;
            document.getElementById('user-avatar').textContent = name.charAt(0).toUpperCase();
        }

        // Chat Channels & Navigation
        function initChatListeners() {
            refreshUsersAndRooms();
            switchChat('general', 'room', 'General Chat');
        }

        function renderRoomsList() {
            const container = document.getElementById('rooms-list');
            container.innerHTML = '';
            window.appState.rooms.forEach(room => {
                const isActive = window.appState.activeChatId === room.id && window.appState.activeChatType === 'room';
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `w-full text-left px-3 py-2.5 rounded-xl flex items-center gap-3 transition ${isActive ? 'bg-brand-600/10 text-brand-400 font-semibold border border-brand-500/20' : 'text-slate-300 hover:bg-slate-900 hover:text-white'}`;
                btn.innerHTML = `
                    <div class="w-8 h-8 rounded-lg ${isActive ? 'bg-brand-600 text-white' : 'bg-slate-900 text-slate-400'} flex items-center justify-center text-sm">
                        <i class="fa-solid ${room.icon || 'fa-hashtag'}"></i>
                    </div>
                    <div class="overflow-hidden flex-1">
                        <p class="text-sm truncate">${room.name}</p>
                        <p class="text-xs text-slate-500 truncate">${room.desc || 'Discussion room'}</p>
                    </div>
                `;
                btn.onclick = () => switchChat(room.id, 'room', room.name);
                container.appendChild(btn);
            });
        }

        function renderUsersList() {
            const container = document.getElementById('users-list');
            container.innerHTML = '';
            if (window.appState.users.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 px-3 py-2 italic">Open another tab to test live DMs!</p>`;
                return;
            }
            window.appState.users.forEach(user => {
                const isDmActive = window.appState.activeChatId === user.uid && window.appState.activeChatType === 'dm';
                const dmId = [window.appState.currentUser.uid, user.uid].sort().join('_');
                
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `w-full text-left px-3 py-2.5 rounded-xl flex items-center gap-3 transition ${isDmActive ? 'bg-brand-600/10 text-brand-400 font-semibold border border-brand-500/20' : 'text-slate-300 hover:bg-slate-900 hover:text-white'}`;
                btn.innerHTML = `
                    <div class="relative">
                        <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center font-bold text-slate-300 text-xs">
                            ${(user.displayName || 'U').charAt(0).toUpperCase()}
                        </div>
                        <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-500 border-2 border-slate-950 rounded-full"></span>
                    </div>
                    <div class="overflow-hidden flex-1">
                        <p class="text-sm truncate">${user.displayName}</p>
                        <p class="text-xs text-slate-500 truncate">Direct Message</p>
                    </div>
                `;
                btn.onclick = () => switchChat(dmId, 'dm', user.displayName);
                container.appendChild(btn);
            });
        }

        window.switchChat = function(chatId, type, chatName) {
            window.appState.activeChatId = chatId;
            window.appState.activeChatType = type;
            window.appState.activeChatName = chatName;

            document.getElementById('active-chat-title').textContent = chatName;
            document.getElementById('active-chat-subtitle').textContent = type === 'room' ? 'Public discussion room' : 'Direct secure peer chat';
            document.getElementById('active-chat-icon').innerHTML = type === 'room' ? '<i class="fa-solid fa-hashtag"></i>' : '<i class="fa-solid fa-user"></i>';

            renderRoomsList();
            renderUsersList();

            // Close mobile sidebar if open
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (!sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }

            loadMessagesForActiveChat();
        };

        // Message Handling & Storage
        function getStorageKeyForChat(chatId) {
            return `nexus_messages_${chatId}`;
        }

        function loadMessagesForActiveChat() {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';

            const storageKey = getStorageKeyForChat(window.appState.activeChatId);
            const rawMessages = localStorage.getItem(storageKey);
            const messages = rawMessages ? JSON.parse(rawMessages) : [];

            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="flex-1 flex flex-col items-center justify-center text-center p-8 text-slate-500">
                        <div class="w-16 h-16 rounded-2xl bg-slate-800/50 flex items-center justify-center text-slate-400 text-2xl mb-3">
                            <i class="fa-regular fa-comment-dots"></i>
                        </div>
                        <p class="text-sm font-medium text-slate-300">No messages in #${window.appState.activeChatName} yet</p>
                        <p class="text-xs text-slate-500 mt-1">Send a message below or open another browser tab to chat live!</p>
                    </div>
                `;
                return;
            }

            messages.forEach(msg => renderMessageNode(msg));
            container.scrollTop = container.scrollHeight;
        }

        function appendMessageToDOM(msg) {
            const container = document.getElementById('messages-container');
            // Remove empty placeholder if present
            if (container.querySelector('.text-slate-500')) {
                container.innerHTML = '';
            }
            renderMessageNode(msg);
            container.scrollTop = container.scrollHeight;
        }

        function renderMessageNode(msg) {
            const container = document.getElementById('messages-container');
            const isMe = msg.senderId === window.appState.currentUser?.uid;
            const timeStr = new Date(msg.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const msgDiv = document.createElement('div');
            msgDiv.className = `flex gap-3 max-w-[85%] md:max-w-[70%] ${isMe ? 'ml-auto flex-row-reverse' : ''}`;
            
            let contentHTML = `<p class="text-sm leading-relaxed whitespace-pre-wrap break-words">${escapeHtml(msg.text || '')}</p>`;
            if (msg.mediaUrl) {
                contentHTML += `<div class="mt-2 rounded-lg overflow-hidden border border-slate-700 bg-slate-950 p-2 flex items-center gap-3">
                    <i class="fa-solid fa-file-arrow-down text-brand-400 text-xl"></i>
                    <div class="overflow-hidden">
                        <p class="text-xs font-semibold text-white truncate">${escapeHtml(msg.mediaName || 'Attachment')}</p>
                        <a href="${msg.mediaUrl}" target="_blank" class="text-[10px] text-brand-400 hover:underline">Download / View Media</a>
                    </div>
                </div>`;
            }

            msgDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full ${isMe ? 'bg-brand-600' : 'bg-slate-700'} flex-shrink-0 flex items-center justify-center font-bold text-xs text-white">
                    ${(msg.senderName || 'U').charAt(0).toUpperCase()}
                </div>
                <div class="${isMe ? 'items-end' : 'items-start'} flex flex-col">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-xs font-semibold text-slate-300">${escapeHtml(msg.senderName || 'Anonymous')}</span>
                        <span class="text-[10px] text-slate-500">${timeStr}</span>
                    </div>
                    <div class="p-3.5 rounded-2xl ${isMe ? 'bg-brand-600 text-white rounded-tr-none' : 'bg-slate-800 text-slate-100 border border-slate-700/80 rounded-tl-none'} shadow-sm">
                        ${contentHTML}
                    </div>
                </div>
            `;
            container.appendChild(msgDiv);
        }

        window.handleSendMessage = function(event) {
            event.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text && !window.pendingMedia) return;

            const user = window.appState.currentUser;
            if (!user) return;

            const message = {
                id: 'msg_' + Math.random().toString(36).substring(2, 9),
                senderId: user.uid,
                senderName: user.displayName || 'Anonymous',
                text: text,
                createdAt: Date.now()
            };

            if (window.pendingMedia) {
                message.mediaUrl = window.pendingMedia.url;
                message.mediaName = window.pendingMedia.name;
                window.pendingMedia = null;
            }

            input.value = '';
            input.style.height = 'auto';

            // Save to localStorage
            const storageKey = getStorageKeyForChat(window.appState.activeChatId);
            const existing = JSON.parse(localStorage.getItem(storageKey) || '[]');
            existing.push(message);
            localStorage.setItem(storageKey, JSON.stringify(existing));

            // Append locally and broadcast to other tabs
            appendMessageToDOM(message);
            broadcastChannel.postMessage({
                type: 'NEW_MESSAGE',
                payload: { chatId: window.appState.activeChatId, message }
            });
        };

        window.handleKeyDown = function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('message-form').dispatchEvent(new Event('submit', { cancelable: true }));
            }
        };

        // Emoji Picker Logic
        const emojis = ['😀', '😂', '😍', '🔥', '👍', '🎉', '🚀', '😎', '💡', '❤️', '✨', '🙌', '☕', '💻', '🥳', '💯', '👏', '⭐'];
        function populateEmojis() {
            const picker = document.getElementById('emoji-picker');
            picker.innerHTML = '';
            emojis.forEach(emoji => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'text-xl hover:scale-125 transition transform p-1 rounded hover:bg-slate-700 flex items-center justify-center';
                btn.textContent = emoji;
                btn.onclick = () => {
                    const input = document.getElementById('message-input');
                    input.value += emoji;
                    input.focus();
                    toggleEmojiPicker();
                };
                picker.appendChild(btn);
            });
        }

        window.toggleEmojiPicker = function() {
            const picker = document.getElementById('emoji-picker');
            picker.classList.toggle('hidden');
        };

        // Media attachment
        window.triggerMediaUpload = function() {
            document.getElementById('media-input').click();
        };

        window.handleMediaSelect = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const fileUrl = URL.createObjectURL(file);
            window.pendingMedia = {
                url: fileUrl,
                name: file.name
            };

            showToast(`Attached: ${file.name}`);
            event.target.value = '';
        };

        window.clearChatHistory = function() {
            const storageKey = getStorageKeyForChat(window.appState.activeChatId);
            localStorage.removeItem(storageKey);
            loadMessagesForActiveChat();
            showToast('Chat history cleared');
        };

        window.toggleSidebar = function() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            sidebar.classList.toggle('-translate-x-full');
            backdrop.classList.toggle('hidden');
        };

        window.openCreateRoomModal = function() {
            const roomName = prompt("Enter new room name:");
            if (!roomName || !roomName.trim()) return;
            const roomId = roomName.trim().toLowerCase().replace(/\s+/g, '-');
            
            if (window.appState.rooms.some(r => r.id === roomId)) {
                showToast('Room already exists!', 'error');
                return;
            }

            const newRoom = {
                id: roomId,
                name: roomName.trim(),
                desc: 'Custom community room',
                icon: 'fa-comments'
            };

            window.appState.rooms.push(newRoom);
            const customRooms = JSON.parse(localStorage.getItem('nexus_custom_rooms') || '[]');
            customRooms.push(newRoom);
            localStorage.setItem('nexus_custom_rooms', JSON.stringify(customRooms));

            broadcastChannel.postMessage({ type: 'ROOM_CREATED' });
            renderRoomsList();
            switchChat(roomId, 'room', roomName.trim());
            showToast(`Created room #${roomName.trim()}`);
        };

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            document.getElementById('toast-msg').textContent = msg;

            if (type === 'error') {
                icon.className = 'fa-solid fa-circle-exclamation text-rose-400';
            } else {
                icon.className = 'fa-solid fa-circle-check text-emerald-400';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
