<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Clone - Chat App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar matching Discord dark theme */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #2e3136; }
        ::-webkit-scrollbar-thumb { background: #202225; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#36393f] text-[#dcddde] h-screen flex flex-col overflow-hidden font-sans">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 bg-[#2f3136] z-50 flex items-center justify-center">
        <div class="bg-[#36393f] p-8 rounded-lg shadow-2xl w-full max-w-md text-center border border-[#202225]">
            <h1 class="text-2xl font-bold text-white mb-2">Welcome to Discord Web</h1>
            <p class="text-[#8e9297] text-sm mb-6">Connect instantly with a mock Google account, no MFA or API keys needed.</p>
            
            <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-white text-[#36393f] font-semibold py-3 px-4 rounded-md hover:bg-gray-100 transition shadow">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.2v3.15C3.15 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.2C.43 8.15 0 9.89 0 12s.43 3.85 1.2 5.4l4.07-3.16z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.68 1.2 6.6l4.07 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                Sign in with Google
            </button>
        </div>
    </div>

    <!-- MAIN DISCORD INTERFACE -->
    <div id="app-screen" class="hidden flex h-full w-full">
        
        <!-- 1. SERVERS SIDEBAR -->
        <div class="w-[72px] bg-[#202225] flex flex-col items-center py-3 gap-2 flex-shrink-0">
            <!-- Home / Direct Messages Icon -->
            <button onclick="switchServer('Home')" class="w-12 h-12 rounded-3xl bg-[#36393f] hover:rounded-2xl hover:bg-[#5865f2] hover:text-white transition-all flex items-center justify-center text-white font-bold group relative">
                💬
                <span class="absolute left-16 bg-[#18191c] text-white text-xs px-2 py-1 rounded shadow-md opacity-0 group-hover:opacity-100 transition whitespace-nowrap z-50 pointer-events-none">Direct Messages</span>
            </button>
            <div class="w-8 h-[2px] bg-[#36393f] rounded"></div>
            <!-- Server 1 -->
            <button onclick="switchServer('General Lounge')" class="w-12 h-12 rounded-3xl bg-[#2f3136] hover:rounded-2xl hover:bg-[#5865f2] hover:text-white transition-all flex items-center justify-center text-white font-bold group relative">
                GL
                <span class="absolute left-16 bg-[#18191c] text-white text-xs px-2 py-1 rounded shadow-md opacity-0 group-hover:opacity-100 transition whitespace-nowrap z-50 pointer-events-none">General Lounge</span>
            </button>
            <!-- Server 2 -->
            <button onclick="switchServer('Developers Hub')" class="w-12 h-12 rounded-3xl bg-[#2f3136] hover:rounded-2xl hover:bg-[#5865f2] hover:text-white transition-all flex items-center justify-center text-white font-bold group relative">
                DH
                <span class="absolute left-16 bg-[#18191c] text-white text-xs px-2 py-1 rounded shadow-md opacity-0 group-hover:opacity-100 transition whitespace-nowrap z-50 pointer-events-none">Developers Hub</span>
            </button>
        </div>

        <!-- 2. CHANNELS SIDEBAR -->
        <div class="w-60 bg-[#2f3136] flex flex-col flex-shrink-0">
            <!-- Server Title Header -->
            <div class="h-12 border-b border-[#202225] flex items-center px-4 font-bold text-white shadow-sm justify-between">
                <span id="current-server-title">Home</span>
            </div>

            <!-- Channels List -->
            <div class="flex-1 overflow-y-auto px-2 py-3 space-y-1">
                <div class="text-xs font-semibold text-[#8e9297] px-2 mb-1 uppercase tracking-wider">Text Channels</div>
                <div id="channels-container" class="space-y-[2px]">
                    <!-- Injected via JS -->
                </div>

                <div class="text-xs font-semibold text-[#8e9297] px-2 mt-4 mb-1 uppercase tracking-wider">Voice Channels</div>
                <div onclick="alert('Voice channel simulation: Connected!')" class="flex items-center gap-2 px-2 py-1.5 rounded text-[#8e9297] hover:bg-[#34373c] hover:text-[#dcddde] cursor-pointer text-sm">
                    🔊 General Voice
                </div>
            </div>

            <!-- User Footer Profile Card -->
            <div class="h-14 bg-[#292b2f] px-2 flex items-center justify-between">
                <div class="flex items-center gap-2 overflow-hidden">
                    <div id="user-avatar" class="w-8 h-8 rounded-full bg-[#5865f2] flex items-center justify-center font-bold text-white text-sm">U</div>
                    <div class="overflow-hidden">
                        <div id="footer-username" class="text-sm font-bold text-white truncate">Username</div>
                        <div class="text-xs text-[#b9bbbe]">Online</div>
                    </div>
                </div>
                <button onclick="logout()" title="Log Out" class="text-[#b9bbbe] hover:text-white text-sm p-1">🚪</button>
            </div>
        </div>

        <!-- 3. CHAT MAIN WINDOW -->
        <div class="flex-1 flex flex-col bg-[#36393f]">
            <!-- Chat Header -->
            <div class="h-12 border-b border-[#202225] flex items-center px-4 shadow-sm font-bold text-white gap-2">
                <span class="text-[#8e9297] text-xl">#</span>
                <span id="current-channel-title">general</span>
            </div>

            <!-- Messages Stream Area -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Messages injected here -->
            </div>

            <!-- Message Input Form -->
            <div class="p-4 bg-[#36393f]">
                <form id="message-form" onsubmit="sendMessage(event)" class="bg-[#40444b] rounded-lg flex items-center px-4 py-2.5">
                    <input type="text" id="message-input" placeholder="Message #general" class="w-full bg-transparent text-[#dcddde] focus:outline-none placeholder-[#72767d] text-sm" autocomplete="off">
                    <button type="submit" class="bg-[#5865f2] hover:bg-[#4752c4] text-white px-4 py-1.5 rounded text-sm font-medium transition ml-2">Send</button>
                </form>
            </div>
        </div>

        <!-- 4. ACTIVE MEMBERS SIDEBAR -->
        <div class="w-60 bg-[#2f3136] flex flex-col flex-shrink-0 p-4 border-l border-[#202225]">
            <div class="text-xs font-semibold text-[#8e9297] uppercase tracking-wider mb-2">Online — 2</div>
            <div class="space-y-2">
                <div class="flex items-center gap-3 px-1 py-1 rounded hover:bg-[#34373c] cursor-pointer">
                    <div class="w-8 h-8 rounded-full bg-green-500 flex items-center justify-center font-bold text-white text-xs">🤖</div>
                    <span class="text-sm text-[#dcddde] font-medium">Discord Bot</span>
                </div>
                <div class="flex items-center gap-3 px-1 py-1 rounded hover:bg-[#34373c] cursor-pointer">
                    <div id="sidebar-user-avatar" class="w-8 h-8 rounded-full bg-[#5865f2] flex items-center justify-center font-bold text-white text-xs">U</div>
                    <span id="sidebar-username" class="text-sm text-[#dcddde] font-medium">Username</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        // State variables
        let currentUser = null;
        let currentServer = 'Home';
        let currentChannel = 'welcome';
        
        // Mock databases stored in localStorage for multi-tab testing sync
        const channels = {
            'Home': ['welcome', 'direct-messages'],
            'General Lounge': ['general', 'memes', 'gaming'],
            'Developers Hub': ['announcements', 'coding-help', 'showcase']
        };

        const channelNames = {
            'welcome': 'Welcome',
            'direct-messages': 'Direct Messages',
            'general': 'general',
            'memes': 'memes',
            'gaming': 'gaming',
            'announcements': 'announcements',
            'coding-help': 'coding-help',
            'showcase': 'showcase'
        };

        function loginWithGoogle() {
            // Simulated secure Google Profile credentials without MFA challenges
            const randomNames = ["Alex Rider", "Sarah Connor", "Neo Anderson", "Elena Fisher", "Marcus Vance"];
            const chosenName = randomNames[Math.floor(Math.random() * randomNames.length)];
            
            currentUser = {
                name: chosenName,
                email: chosenName.toLowerCase().replace(' ', '.') + '@gmail.com',
                avatar: chosenName.charAt(0)
            };

            localStorage.setItem('discord_user', JSON.stringify(currentUser));
            initApp();
        }

        function logout() {
            localStorage.removeItem('discord_user');
            currentUser = null;
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        function initApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');

            document.getElementById('user-avatar').textContent = currentUser.avatar;
            document.getElementById('footer-username').textContent = currentUser.name;
            document.getElementById('sidebar-user-avatar').textContent = currentUser.avatar;
            document.getElementById('sidebar-username').textContent = currentUser.name;

            switchServer('Home');
        }

        function switchServer(serverName) {
            currentServer = serverName;
            document.getElementById('current-server-title').textContent = serverName;
            
            // Switch to the first channel of this server automatically
            const serverChannels = channels[serverName];
            switchChannel(serverChannels[0]);
            renderChannels();
        }

        function renderChannels() {
            const container = document.getElementById('channels-container');
            container.innerHTML = '';
            
            channels[currentServer].forEach(chanKey => {
                const isActive = chanKey === currentChannel;
                const activeClass = isActive ? 'bg-[#393c43] text-white' : 'text-[#8e9297] hover:bg-[#34373c] hover:text-[#dcddde]';
                
                const div = document.createElement('div');
                div.className = `flex items-center gap-2 px-2 py-1.5 rounded cursor-pointer text-sm font-medium transition ${activeClass}`;
                div.innerHTML = `<span class="text-lg text-[#72767d]">#</span> ${channelNames[chanKey] || chanKey}`;
                div.onclick = () => switchChannel(chanKey);
                container.appendChild(div);
            });
        }

        function switchChannel(chanKey) {
            currentChannel = chanKey;
            document.getElementById('current-channel-title').textContent = channelNames[chanKey] || chanKey;
            document.getElementById('message-input').placeholder = `Message #${channelNames[chanKey] || chanKey}`;
            renderChannels();
            renderMessages();
        }

        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const message = {
                id: Date.now(),
                user: currentUser.name,
                avatar: currentUser.avatar,
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            // Retrieve current channel message array from localStorage
            const storageKey = `messages_${currentChannel}`;
            let messages = JSON.parse(localStorage.getItem(storageKey)) || [];
            messages.push(message);
            localStorage.setItem(storageKey, JSON.stringify(messages));

            input.value = '';
            renderMessages();
        }

        function renderMessages() {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';

            const storageKey = `messages_${currentChannel}`;
            let messages = JSON.parse(localStorage.getItem(storageKey)) || [];

            // Add default welcome message if empty
            if (messages.length === 0) {
                messages.push({
                    user: 'Discord Bot',
                    avatar: '🤖',
                    text: `Welcome to #${channelNames[currentChannel] || currentChannel}! This is the start of your channel history.`,
                    time: '12:00 PM'
                });
            }

            messages.forEach(msg => {
                const item = document.createElement('div');
                item.className = 'flex items-start gap-4 mt-4 hover:bg-[#32353b] p-1 rounded transition';
                item.innerHTML = `
                    <div class="w-10 h-10 rounded-full bg-[#5865f2] flex items-center justify-center font-bold text-white flex-shrink-0">${msg.avatar}</div>
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="font-semibold text-white text-sm">${msg.user}</span>
                            <span class="text-xs text-[#72767d]">${msg.time}</span>
                        </div>
                        <p class="text-sm text-[#dcddde] mt-1">${escapeHtml(msg.text)}</p>
                    </div>
                `;
                container.appendChild(item);
            });

            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Live multi-tab sync listener via localStorage events
        window.addEventListener('storage', (e) => {
            if (e.key === `messages_${currentChannel}`) {
                renderMessages();
            }
        });

        // Auto-login check on page refresh
        window.onload = () => {
            const saved = localStorage.getItem('discord_user');
            if (saved) {
                currentUser = JSON.parse(saved);
                initApp();
            }
        };
    </script>
</body>
</html>
